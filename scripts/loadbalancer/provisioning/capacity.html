<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Servers at Capacity</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 40px 32px;
            max-width: 400px;
            width: 100%;
        }
        h2 {
            color: #2d3a4b;
            margin-bottom: 16px;
        }
        p {
            color: #4b5d6b;
            margin-bottom: 24px;
        }
        input[type=email] {
            padding: 12px;
            width: 100%;
            border: 1px solid #b0bec5;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 16px;
        }
        button {
            background: #1976d2;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 0;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #1565c0;
        }
        .icon {
            font-size: 48px;
            color: #1976d2;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">&#9888;</div>
        <h2>Servers at Capacity</h2>
        <p>Our application servers are currently overloaded.<br>Please enter your Gmail address below and we'll notify you as soon as service is restored.</p>
        <form action="/notify" method="POST">
            <input type="email" name="email" id="emailInput" placeholder="your@gmail.com" required>
            <button type="submit" id="notifyBtn">Notify Me</button>
        </form>
        <div id="confirmationMsg" style="display:none; color:#1976d2; font-weight:bold; margin-top:20px;"></div>
    </div>
<script>
document.querySelector('form').addEventListener('submit', function(e) {
    e.preventDefault();
    var email = document.getElementById('emailInput').value;
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/notify', true);
    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    xhr.onreadystatechange = function() {
        if (xhr.readyState === 4 && xhr.status === 200) {
            document.querySelector('form').style.display = 'none';
            document.getElementById('confirmationMsg').innerText = 'We will notify you when the servers are up.';
            document.getElementById('confirmationMsg').style.display = 'block';
        }
    };
    xhr.send('email=' + encodeURIComponent(email));
});
</script>
</body>
</html>
